server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/rlabz/frontend/dist;
    index index.html;

    # Increase body size for file/report uploads (up to 50M)
    client_max_body_size 50M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API routes -> pass to Laravel PHP-FPM
    location ^~ /api/ {
        root /var/www/rlabz/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/rlabz/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }
    }

    # 2. Storage links (uploaded reports, files, avatars)
    location ^~ /storage/ {
        alias /var/www/rlabz/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires max;
    }

    # 3. Frontend Static Assets (cache for speed)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. Frontend SPA Router (HTML5 History Mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
